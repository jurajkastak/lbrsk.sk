<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ďakujeme za dopyt · L.B.R.</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --ground:#FBFAF9;--surface:#FFFFFF;--surface-2:#F4F0ED;
  --ink:#1A1416;--ink-2:#453B3A;--muted:#6F6360;
  --line:#E6E0DC;--line-strong:#D3C9C3;
  --brand:#A50F1A;--brand-ink:#A50F1A;--brand-soft:#FBE9EA;--on-brand:#FFF7F6;
  --radius:14px;--maxw:1180px;
  --shadow:0 1px 0 rgba(26,20,22,.04),0 12px 30px -22px rgba(26,20,22,.45);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#141011;--surface:#1C1718;--surface-2:#241E1F;
    --ink:#F3EDEA;--ink-2:#D6CCC8;--muted:#A69B97;
    --line:#2F2827;--line-strong:#3E3534;
    --brand:#E23B45;--brand-ink:#F0616A;--brand-soft:#2B1417;--on-brand:#1A0E0F;
    --shadow:0 1px 0 rgba(0,0,0,.3),0 16px 34px -24px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --ground:#141011;--surface:#1C1718;--surface-2:#241E1F;
  --ink:#F3EDEA;--ink-2:#D6CCC8;--muted:#A69B97;
  --line:#2F2827;--line-strong:#3E3534;
  --brand:#E23B45;--brand-ink:#F0616A;--brand-soft:#2B1417;--on-brand:#1A0E0F;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 16px 34px -24px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"Public Sans","Helvetica Neue",Arial,sans-serif;font-size:16.5px;line-height:1.62;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:"Bricolage Grotesque","Public Sans",Arial,sans-serif;font-weight:700;letter-spacing:-.02em;line-height:1.06;margin:0;text-wrap:balance}
p{margin:0}
a{color:inherit}
.wrap{width:100%;max-width:var(--maxw);margin-inline:auto;padding-inline:24px}
.lbl{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.tbd{color:var(--muted);border-bottom:1px dashed var(--line-strong);font-style:italic}
a:focus-visible,button:focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:4px}
.skip{position:absolute;left:-999px;top:8px;background:var(--brand);color:var(--on-brand);padding:8px 12px;border-radius:8px;z-index:100}
.skip:focus{left:8px}

/* logo 7A */
.logo{display:inline-flex;align-items:center;gap:12px;text-decoration:none}
.logo .mark{width:44px;height:44px;flex:none;display:block}
.logo .word{font-family:"Bricolage Grotesque",Arial,sans-serif;font-weight:700;font-size:23px;letter-spacing:-.03em;line-height:1;color:var(--ink)}
.logo .sub{font-family:"JetBrains Mono",monospace;font-size:8.6px;letter-spacing:.2em;color:var(--muted);margin-top:5px;white-space:nowrap;display:block}

/* header */
header.top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top .bar{display:flex;align-items:center;gap:28px;height:78px}
nav.main{display:flex;gap:22px;margin-left:auto;flex-wrap:wrap}
nav.main a{text-decoration:none;color:var(--ink-2);font-size:14.5px;font-weight:500;padding:6px 0;border-bottom:2px solid transparent}
nav.main a:hover{color:var(--brand-ink);border-bottom-color:var(--brand)}
.btn{display:inline-flex;align-items:center;gap:9px;font-weight:600;font-size:15px;text-decoration:none;padding:12px 20px;border-radius:10px;border:1px solid transparent;transition:transform .12s ease,background .12s ease,border-color .12s ease}
.btn-brand{background:var(--brand);color:var(--on-brand)}
.btn-brand:hover{transform:translateY(-1px)}
.btn-ghost{border-color:var(--line-strong);color:var(--ink)}
.btn-ghost:hover{border-color:var(--brand);color:var(--brand-ink)}
.top .btn{margin-left:auto}
nav.main + .btn{margin-left:0}

/* hero */
.hero{padding:86px 0 64px;border-bottom:1px solid var(--line)}
.hero-grid{display:grid;grid-template-columns:1.35fr .85fr;gap:56px;align-items:end}
.hero h1{font-size:clamp(40px,5.6vw,68px);font-weight:800}
.hero h1 em{font-style:normal;color:var(--brand-ink)}
.hero .lead{margin-top:24px;font-size:19px;color:var(--ink-2);max-width:56ch}
.hero .cta{display:flex;gap:12px;margin-top:34px;flex-wrap:wrap}
.hero-aside{border-left:1px solid var(--line);padding-left:28px;display:grid;gap:20px}
.hero-aside .item strong{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:19px;letter-spacing:-.01em}
.hero-aside .item span{font-size:14.5px;color:var(--muted)}

/* sections */
section{padding:76px 0;border-bottom:1px solid var(--line)}
.sec-head{display:grid;grid-template-columns:220px 1fr;gap:40px;margin-bottom:44px;align-items:start}
.sec-head h2{font-size:clamp(28px,3.4vw,40px)}
.sec-head p{color:var(--ink-2);max-width:62ch;margin-top:14px}

/* sortiment – karty */
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.cat{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:26px 26px 22px;text-decoration:none;box-shadow:0 1px 0 rgba(26,20,22,.03)}
.cat .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.cat .ico{width:52px;height:52px;border-radius:14px;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center}
.cat .ico svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cat .num{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--muted);letter-spacing:.12em}
.cat h3{font-size:22px;letter-spacing:-.015em;min-height:2.2em;display:flex;align-items:flex-end}
.cat .desc{color:var(--muted);font-size:15px;display:block;margin-top:10px;min-height:3.2em}
.cat .subs{display:grid;margin-top:18px;border-top:1px solid var(--line)}
.cat .subs span{font-size:14.5px;color:var(--ink-2);padding:9px 0 9px 18px;border-bottom:1px solid var(--line);position:relative;line-height:1.35}
.cat .subs span::before{content:"";position:absolute;left:0;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--brand)}
.cat .go{font-weight:600;font-size:14.5px;color:var(--brand-ink);white-space:nowrap;margin-top:auto;padding-top:20px;display:flex;justify-content:space-between;align-items:center}
.cat .go::after{content:"→";transition:transform .3s var(--ease)}
.cat:hover .go::after{transform:translateX(5px)}

/* piliere */
.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.pillar{background:var(--surface);padding:28px 26px}
.pillar h3{font-size:18px;margin-bottom:8px}
.pillar p{font-size:14.8px;color:var(--muted)}
.pillar .k{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--brand-ink);letter-spacing:.12em;display:block;margin-bottom:14px}

/* eko */
.eco{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.eco-card{background:var(--brand-soft);border-radius:var(--radius);padding:38px 34px}
.eco-card h2{font-size:clamp(26px,3vw,36px);color:var(--brand-ink)}
.eco-card p{margin-top:16px;color:var(--ink-2)}
.eco ul{margin:0;padding-left:20px;display:grid;gap:12px;color:var(--ink-2)}

/* kroky */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:26px}
.step{border-top:2px solid var(--brand);padding-top:16px}
.step h3{font-size:17px;margin-bottom:8px}
.step p{font-size:14.8px;color:var(--muted)}

/* kontakt */
.contact{display:grid;grid-template-columns:1fr 1fr;gap:56px}
.contact-rows{display:grid;gap:0}
.crow{display:grid;grid-template-columns:150px 1fr;gap:20px;padding:16px 0;border-top:1px solid var(--line);align-items:baseline}
.crow:last-child{border-bottom:1px solid var(--line)}
.crow a{color:var(--brand-ink);text-decoration:none}
.crow a:hover{text-decoration:underline}
.dopyt{scroll-margin-top:100px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:30px 28px;box-shadow:var(--shadow)}
.dopyt h3{font-size:22px;margin-bottom:10px}
.dopyt p{color:var(--ink-2);font-size:15px}
.dopyt .note a{color:var(--brand-ink)}
.dopyt ul{margin:16px 0 0;padding-left:20px;color:var(--ink-2);font-size:15px;display:grid;gap:8px}

/* footer */
footer{background:var(--surface-2);padding:64px 0 34px}
.fgrid{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:40px}
.fcol h4{font-family:"Public Sans",sans-serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 14px}
.fcol ul{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.fcol a,.fcol span{font-size:14.5px;color:var(--ink-2);text-decoration:none}
.fcol a:hover{color:var(--brand-ink)}
.fcol span.soon{color:var(--muted)}
.fnote{font-size:14px;color:var(--muted);max-width:38ch;margin-top:18px}
.fbot{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-top:48px;padding-top:20px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}

@media (max-width:960px){
  .hero-grid,.eco,.contact{grid-template-columns:1fr;gap:38px}
  .hero-aside{border-left:0;border-top:1px solid var(--line);padding-left:0;padding-top:24px}
  .sec-head{grid-template-columns:1fr;gap:14px}
  .pillars,.steps{grid-template-columns:repeat(2,1fr)}
  .cats{grid-template-columns:1fr}
  .fgrid{grid-template-columns:1fr 1fr}
  nav.main{display:none}
}
@media (max-width:620px){
  .wrap{padding-inline:16px}
  .pillars,.steps,.fgrid{grid-template-columns:1fr}
  .crow{grid-template-columns:1fr;gap:2px}
  .top .bar{height:auto;padding:14px 0;gap:12px;flex-wrap:wrap}
  .logo .sub{display:none}
}

/* formulár dopytu */
.contact{grid-template-columns:.85fr 1.15fr}
.dopyt form{margin-top:22px;display:grid;gap:16px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:grid;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.field label small{font-weight:400;color:var(--muted)}
.field input,.field textarea{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--ground);border:1px solid var(--line-strong);border-radius:10px;padding:11px 13px;transition:border-color .2s ease,box-shadow .2s ease,background .2s ease}
.field textarea{min-height:120px;resize:vertical}
.field input:hover,.field textarea:hover{border-color:var(--muted)}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);background:var(--surface)}
.field input::placeholder,.field textarea::placeholder{color:var(--muted);opacity:.8}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{position:relative;cursor:pointer;font-size:13.5px;font-weight:500;color:var(--ink-2);background:var(--ground);border:1px solid var(--line-strong);border-radius:999px;padding:7px 14px 7px 12px;display:inline-flex;align-items:center;gap:8px;transition:all .2s ease;user-select:none}
.chips label::before{content:"";width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line-strong);background:var(--surface);flex:none;transition:all .2s ease}
.chips input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.chips label:hover{border-color:var(--muted)}
.chips input:checked+label{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-ink)}
.chips input:checked+label::before{background:var(--brand);border-color:var(--brand);box-shadow:inset 0 0 0 3px var(--surface)}
.chips input:focus-visible+label{outline:2px solid var(--brand);outline-offset:2px}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--muted);line-height:1.5}
.consent input{margin-top:3px;accent-color:var(--brand);width:16px;height:16px;flex:none}
.fsend{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:4px}
.fsend .note{font-size:13px;color:var(--muted)}
.hp{position:absolute;left:-9999px;opacity:0;height:0;width:0}
@media (max-width:620px){.frow{grid-template-columns:1fr}}

/* ===== prechody a pohyb ===== */
:root{--ease:cubic-bezier(.22,1,.36,1);--dur:.6s}

/* nav – podčiarknutie sa vykreslí zľava */
nav.main a{position:relative;border-bottom:0;transition:color .2s ease}
nav.main a::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--brand);transform:scaleX(0);transform-origin:left;transition:transform .28s var(--ease)}
nav.main a:hover::after,nav.main a[aria-current="true"]::after{transform:scaleX(1)}
nav.main a[aria-current="true"]{color:var(--brand-ink)}

/* header sa pri scrolle zúži */
.top .bar{transition:height .3s var(--ease)}
header.top.scrolled .bar{height:64px}
header.top{transition:box-shadow .3s ease}
header.top.scrolled{box-shadow:0 8px 24px -20px rgba(26,20,22,.35)}

/* tlačidlá */
.btn{transition:transform .2s var(--ease),background .2s ease,border-color .2s ease,box-shadow .25s ease,color .2s ease}
.btn-brand:hover{transform:translateY(-2px);box-shadow:0 10px 22px -12px rgba(165,15,26,.6)}
.btn-brand:active{transform:translateY(0);box-shadow:none}
.btn-ghost:hover{transform:translateY(-2px);background:var(--surface)}

/* logo – jemné zvýraznenie */
.logo .mark{transition:transform .35s var(--ease)}
.logo:hover .mark{transform:rotate(-6deg) scale(1.04)}

/* sortiment – riadok kategórie */
.cat{transition:transform .35s var(--ease),box-shadow .35s ease,border-color .3s ease}
.cat:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--line-strong)}
.cat .ico{transition:transform .35s var(--ease),background .3s ease,color .3s ease}
.cat:hover .ico{transform:scale(1.06);background:var(--brand);color:var(--on-brand)}

/* piliere – zdvihnutie karty */
.pillar{transition:transform .35s var(--ease),box-shadow .35s ease,background .25s ease;position:relative;z-index:0}
.pillar:hover{transform:translateY(-4px);box-shadow:var(--shadow);z-index:1}
.pillar .k{transition:letter-spacing .3s var(--ease)}
.pillar:hover .k{letter-spacing:.2em}

/* kroky – čiara dobehne zľava */
.step{position:relative;border-top-color:var(--line)}
.step::before{content:"";position:absolute;top:-2px;left:0;height:2px;width:0;background:var(--brand);transition:width .8s var(--ease)}
.step.in::before{width:100%}
.steps .step:nth-child(2)::before{transition-delay:.12s}
.steps .step:nth-child(3)::before{transition-delay:.24s}
.steps .step:nth-child(4)::before{transition-delay:.36s}

/* eko karta, dopyt */
.eco-card,.dopyt{transition:transform .4s var(--ease),box-shadow .4s ease}
.dopyt:hover{transform:translateY(-3px)}

/* odkazy v pätičke */
.fcol a{transition:color .2s ease,padding-left .25s var(--ease)}
.fcol a:hover{padding-left:4px}

/* reveal pri scrollovaní – bez JS je všetko viditeľné */
.js .reveal{opacity:0;transform:translateY(18px);transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease)}
.js .reveal.in{opacity:1;transform:none}
.js .reveal-stagger>*{opacity:0;transform:translateY(14px);transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease)}
.js .reveal-stagger.in>*{opacity:1;transform:none}
.reveal-stagger>*:nth-child(1){transition-delay:0s}
.reveal-stagger>*:nth-child(2){transition-delay:.08s}
.reveal-stagger>*:nth-child(3){transition-delay:.16s}
.reveal-stagger>*:nth-child(4){transition-delay:.24s}
.reveal-stagger>*:nth-child(5){transition-delay:.32s}
.reveal-stagger>*:nth-child(6){transition-delay:.40s}
.reveal-stagger>*:nth-child(7){transition-delay:.48s}

/* hero – vstup pri načítaní */
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.hero .lbl,.hero h1,.hero .lead,.hero .cta{animation:rise .7s var(--ease) both}
.hero h1{animation-delay:.08s}.hero .lead{animation-delay:.18s}.hero .cta{animation-delay:.28s}
.hero-aside .item{animation:rise .7s var(--ease) both}
.hero-aside .item:nth-child(1){animation-delay:.3s}.hero-aside .item:nth-child(2){animation-delay:.38s}
.hero-aside .item:nth-child(3){animation-delay:.46s}.hero-aside .item:nth-child(4){animation-delay:.54s}
.hero h1 em{background:linear-gradient(currentColor,currentColor) no-repeat left 92%/0 .08em;animation:ul 1s var(--ease) both .8s}
@keyframes ul{to{background-size:100% .08em}}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}.js .reveal,.js .reveal-stagger>*{opacity:1!important;transform:none!important}.step::before{width:100%}}
</style>
<style>.thanks{min-height:calc(100vh - 78px);display:grid;place-items:center;padding:60px 0}.thanks .card{max-width:560px;text-align:center;display:grid;gap:18px;justify-items:center}.thanks .ok{width:64px;height:64px;border-radius:50%;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center;animation:rise .6s var(--ease) both}.thanks .ok svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.thanks h1{font-size:clamp(30px,4vw,44px);animation:rise .6s var(--ease) both .1s}.thanks p{color:var(--ink-2);animation:rise .6s var(--ease) both .2s}.thanks .btn{animation:rise .6s var(--ease) both .3s}</style>
</head>
<body>
<header class="top"><div class="wrap bar">
  <a class="logo" href="/" aria-label="L.B.R. — domov">
    <svg class="mark" viewBox="0 0 64 64" role="img" aria-hidden="true"><rect x="0" y="0" width="64" height="64" rx="17" fill="#A50F1A"></rect><g fill="none" stroke="#FFFFFF" stroke-width="5.2"><circle cx="24.6" cy="32" r="8.6"></circle><circle cx="39.4" cy="32" r="8.6"></circle></g></svg>
    <span><span class="word">L.B.R.</span><span class="sub">LONG BUSINESS RELATIONSHIP</span></span>
  </a>
</div></header>

  <h1>Ďakujeme, ozveme sa do dvoch pracovných dní.</h1>

</div></main>
</body>
</html>
